name: Deploy Full Stack to Aliyun

on:
  # 手动触发
  workflow_dispatch:
  # 当任何文件变更时自动执行全栈部署
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install frontend dependencies
      run: npm install
      
    - name: Build frontend
      run: npm run build
      env:
        REACT_APP_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        REACT_APP_OCR_SERVER_URL: ${{ secrets.OCR_SERVER_URL }}
        
    - name: Install backend dependencies
      run: npm install
      working-directory: ./server
      
    - name: Install OCR server dependencies
      run: pip install -r requirements.txt
      working-directory: ./ocr_server
      
    - name: Pack frontend
      run: tar -czf frontend.tar.gz build/
      
    - name: Pack backend
      run: tar -czf backend.tar.gz server/
      
    - name: Pack OCR server
      run: tar -czf ocr_server.tar.gz ocr_server/
      
    - name: Deploy files to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "frontend.tar.gz,backend.tar.gz,ocr_server.tar.gz"
        target: "/tmp"
        
    - name: Execute deployment script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Stop existing services if any
          pm2 stop all || true
          
          # Deploy frontend
          cd /tmp
          tar -xzf frontend.tar.gz
          rm -rf /home/admin/html/*
          cp -r build/* /home/admin/html/
          
          # Deploy backend
          tar -xzf backend.tar.gz
          rm -rf /home/admin/wrong-question-backend/*
          mkdir -p /home/admin/wrong-question-backend
          cp -r server/* /home/admin/wrong-question-backend/
          
          # Deploy OCR server
          tar -xzf ocr_server.tar.gz
          rm -rf /home/admin/ocr-server/*
          mkdir -p /home/admin/ocr-server
          cp -r ocr_server/* /home/admin/ocr-server/
          
          # Create .env files for backend
          echo "MONGODB_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=5001
          NODE_ENV=production" > /home/admin/wrong-question-backend/.env
          
          # Create .env files for OCR server
          echo "# Ollama 配置（优先使用本地 LLM）
          OLLAMA_BASE_URL=http://localhost:11434
          OLLAMA_MODEL=qwen3-vl:30b
          OLLAMA_TIMEOUT=60
          
          # 通义千问 API（备选方案）
          TONGYI_API_KEY=${{ secrets.TONGYI_API_KEY }}
          TONGYI_VISION_MODEL=qwen-vl-max
          TONGYI_ANALYSIS_MODEL=qwen-math-plus
          
          # DeepSeek API（备选方案）
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          
          # 智谱 AI API
          ZHIPU_API_KEY=${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_VISION_MODEL=glm-4.6v
          ZHIPU_ANALYSIS_MODEL=glm-4.7
          
          # 腾讯混元视觉 API
          HUNYUAN_API_KEY=${{ secrets.HUNYUAN_API_KEY }}
          HUNYUAN_MODEL=hunyuan-vision
          
          # API 超时设置（秒）
          API_TIMEOUT=60
          
          # 默认 LLM 选择
          DEFAULT_LLM=zhipu
          
          # 图片处理配置
          MAX_IMAGE_SIZE=10485760  # 10MB
          IMAGE_QUALITY=95
          
          # 后端 API
          BACKEND_API_URL=http://${{ secrets.SERVER_HOST }}:5001/api
          
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET }}
          
          # Flask 配置
          FLASK_APP=app.py
          FLASK_RUN_PORT=5000
          FLASK_ENV=production" > /home/admin/ocr-server/.env
          
          # Install dependencies on server
          cd /home/admin/wrong-question-backend
          npm install --production
          npm install -g pm2
          
          cd /home/admin/ocr-server
          pip3 install -r requirements.txt
          
          # Create pm2 ecosystem file
          echo "module.exports = {
          apps: [
            {
              name: 'backend-server',
              script: 'server.js',
              cwd: '/home/admin/wrong-question-backend',
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: '1G',
              env: {
                NODE_ENV: 'production'
              }
            },
            {
              name: 'ocr-server',
              script: 'python3',
              args: '-m flask run --host=0.0.0.0 --port=5000',
              cwd: '/home/admin/ocr-server',
              instances: 1,
              autorestart: true,
              watch: false,
              max_memory_restart: '1G',
              env: {
                FLASK_ENV: 'production',
                FLASK_APP: 'app.py'
              }
            }
          ]
          }" > /home/admin/pm2-ecosystem.config.js
          
          # Stop existing services if any
          pm2 stop all || true
          
          # Check and kill processes using ports 5001 and 5000
          lsof -t -i:5001 | xargs kill -9 2>/dev/null || true
          lsof -t -i:5000 | xargs kill -9 2>/dev/null || true
          
          # Wait for ports to be released
          sleep 2
          
          # Start services with pm2
          pm2 start /home/admin/pm2-ecosystem.config.js
          
          # Set pm2 to start on boot
          pm2 save
          pm2 startup systemd -u admin --hp /home/admin
          
          # Clean up
          rm -rf build server ocr_server frontend.tar.gz backend.tar.gz ocr_server.tar.gz
          
          echo "Full stack deployment completed successfully!"
          echo "Frontend: http://${{ secrets.SERVER_HOST }}"
          echo "Backend API: http://${{ secrets.SERVER_HOST }}:5001/api"
          echo "OCR Server: http://${{ secrets.SERVER_HOST }}:5000"
          echo "All services are running under admin user"
